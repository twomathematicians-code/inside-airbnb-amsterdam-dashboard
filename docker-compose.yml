version: "3.9"

services:
  dashboard:
    build: .
    container_name: airbnb-amsterdam-dashboard
    ports:
      - "${PORT:-8051}:8051"
    environment:
      - PORT=8051
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8051/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
